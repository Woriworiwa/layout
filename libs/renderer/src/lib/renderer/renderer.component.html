<div class="flex flex-col h-full w-full">
  <!-- Toolbar -->
  <div
    class="flex items-center justify-between px-4 py-3 border-b border-surface-200 bg-surface-0"
  >
    <div class="flex items-center gap-3">
      <span class="text-sm font-semibold">Preview</span>

      <!-- Viewport Selector -->
      <p-selectButton
        [options]="viewportPresets"
        [(ngModel)]="selectedViewport"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        size="small"
      />

      @if (selectedViewport() === 'custom') {
        <div class="flex items-center gap-2">
          <input
            type="number"
            [(ngModel)]="customWidth"
            (ngModelChange)="updateCustomWidth()"
            class="w-20 px-2 py-1 text-sm border border-surface-300 rounded"
            placeholder="Width"
            min="320"
            max="2560"
          />
          <span class="text-xs text-muted-color">px</span>
        </div>
      }

      <span class="text-xs text-muted-color">{{ currentWidth() }}</span>
    </div>

    <!-- Theme Selector -->
    <div class="flex items-center gap-3">
      <span class="text-xs text-muted-color">Theme:</span>
      <p-selectButton
        [options]="previewThemeService.themeOptions()"
        [ngModel]="previewThemeService.selectedThemeId()"
        (ngModelChange)="onThemeChange($event)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        size="small"
      />
    </div>
  </div>

  <!-- Content Area -->
  <div class="flex-1 flex justify-center bg-surface-50 p-6 overflow-hidden">
    @if (selectedViewport() === 'custom') {
      <!-- Custom viewport with resize handles -->
      <div class="resize-handle-wrapper h-full">
        <div class="resize-handle left" appResizable>
          <i class="pi pi-ellipsis-v"></i>
        </div>

        <div
          class="preview-wrapper bg-white shadow-lg h-full"
        >
          <iframe
            [srcdoc]="code() | unsafeHtml"
            class="h-full border-none pointer-events-none"
            [style.width]="customWidth() + 'px'"
          ></iframe>
        </div>

        <div class="resize-handle right" appResizable>
          <i class="pi pi-ellipsis-v"></i>
        </div>
      </div>
    } @else {
      <!-- Fixed viewport -->
      <div
        class="preview-wrapper bg-white shadow-lg h-full"
        [style.width]="previewWidth()"
      >
        <iframe
          [srcdoc]="code() | unsafeHtml"
          class="w-full h-full border-none"
        ></iframe>
      </div>
    }
  </div>
</div>
